openapi: '3.1.1'
info:
  title: TON HTTP API C++
  description: |
    This API enables HTTP access to TON blockchain - getting accounts and wallets information, looking up blocks and transactions, sending messages to the blockchain, calling get methods of smart contracts, and more.
    
    In addition to REST API, all methods are available through [JSON-RPC endpoint](#json%20rpc)  with `method` equal to method name and `params` passed as a dictionary.
    
    The response contains a JSON object, which always has a boolean field `ok` and either `error` or `result`. If `ok` equals true, the request was successful and the result of the query can be found in the `result` field. In case of an unsuccessful request, `ok` equals false and the error is explained in the `error`.
    
    API Key should be sent either as `api_key` query parameter or `X-API-Key` header
  version: '2.1.11'
paths:
  /api/v2/jsonRPC:
    post:
      tags:
        - rpc
      summary: JSON-RPC endpoint
      description: >-
        All API methods are available through this single endpoint. Send the method name in the
        `method` field and parameters as a dictionary in `params`.
      operationId: jsonRPC_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
        required: true
      responses:
        200:
          description: >-
            Returns the result of the specified JSON-RPC method call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/detectAddress:
    get:
      tags:
        - utils
      summary: Detect address
      description: >-
        Validates an address and returns it in all standard formats. Use this to convert between
        address formats or to validate user input. Returns raw format (0:abc), base64 bounceable
        (EQ), base64 non-bounceable (UQ), and URL-safe variants.
      operationId: detectAddress_get
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        200:
          description: >-
            Returns the address in all supported formats (raw, bounceable, non-bounceable) with
            base64 and URL-safe variants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Detect address
      description: >-
        Validates an address and returns it in all standard formats. Use this to convert between
        address formats or to validate user input. Returns raw format (0:abc), base64 bounceable
        (EQ), base64 non-bounceable (UQ), and URL-safe variants.
      operationId: detectAddress_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectAddressRequest'
        required: true
      responses:
        200:
          description: >-
            Returns the address in all supported formats (raw, bounceable, non-bounceable) with
            base64 and URL-safe variants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/detectHash:
    get:
      tags:
        - utils
      summary: Detect hash
      description: >-
        Validates a hash and returns it in all standard formats. Use this to convert between hex (64
        chars) and base64 (44 chars) representations. Works with any 256-bit hash including
        transaction hashes, block hashes, and message hashes.
      operationId: detectHash_get
      parameters:
        - $ref: '#/components/parameters/hash'
      responses:
        200:
          description: >-
            Returns the hash in all supported formats (hex, base64, URL-safe base64).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Detect hash
      description: >-
        Validates a hash and returns it in all standard formats. Use this to convert between hex (64
        chars) and base64 (44 chars) representations. Works with any 256-bit hash including
        transaction hashes, block hashes, and message hashes.
      operationId: detectHash_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectHashRequest'
        required: true
      responses:
        200:
          description: >-
            Returns the hash in all supported formats (hex, base64, URL-safe base64).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/packAddress:
    get:
      tags:
        - utils
      summary: Pack address
      description: >-
        Converts a raw address to user-friendly base64 format. Raw addresses use the format
        `workchain:hex` (e.g., `0:abc...`). The packed format is shorter and includes a checksum for
        error detection.
      operationId: packAddress_get
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        200:
          description: >-
            Returns the address converted to user-friendly (base64) format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Pack address
      description: >-
        Converts a raw address to user-friendly base64 format. Raw addresses use the format
        `workchain:hex` (e.g., `0:abc...`). The packed format is shorter and includes a checksum for
        error detection.
      operationId: packAddress_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackAddressRequest'
        required: true
      responses:
        200:
          description: >-
            Returns the address converted to user-friendly (base64) format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/unpackAddress:
    get:
      tags:
        - utils
      summary: Unpack address
      description: >-
        Converts a user-friendly base64 address to a raw address string in `workchain:hex` format.
      operationId: unpackAddress_get
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        200:
          description: >-
            Converts a user-friendly base64 address to a raw address string in `workchain:hex`
            format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Unpack address
      description: >-
        Converts a user-friendly base64 address to a raw address string in `workchain:hex` format.
      operationId: unpackAddress_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnpackAddressRequest'
        required: true
      responses:
        200:
          description: >-
            Converts a user-friendly base64 address to a raw address string in `workchain:hex`
            format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  #  /api/v2/ip2dec:
  #  /api/v2/dec2ip:
  /api/v2/getAddressInformation:
    get:
      tags:
        - accounts
      summary: Get Address Information
      description: >-
        Returns the current state of any account on the TON blockchain. Includes the balance (in
        nanotons), smart contract code and data (if deployed), account status, and a reference to
        the last transaction. This is the primary endpoint for checking if an address exists and
        what's deployed there.
      operationId: getAddressInformation_get
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/seqnoOptional'
      responses:
        200:
          description: >-
            The complete current state of the requested account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Address Information
      description: >-
        Returns the current state of any account on the TON blockchain. Includes the balance (in
        nanotons), smart contract code and data (if deployed), account status, and a reference to
        the last transaction. This is the primary endpoint for checking if an address exists and
        what's deployed there.
      operationId: getAddressInformation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInformationRequest'
        required: true
      responses:
        200:
          description: >-
            The complete current state of the requested account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getExtendedAddressInformation:
    get:
      tags:
        - accounts
      summary: Get Extended Address Information
      description: >-
        Returns detailed account information with parsed contract state. For recognized contract
        types, returns type-specific state fields. For other contracts, returns the raw state.
      operationId: getExtendedAddressInformation_get
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/seqnoOptional'
      responses:
        200:
          description: >-
            Returns detailed account information including parsed contract state and type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Extended Address Information
      description: >-
        Returns detailed account information with parsed contract state. For recognized contract
        types, returns type-specific state fields. For other contracts, returns the raw state.
      operationId: getExtendedAddressInformation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendedAddressInformationRequest'
        required: true
      responses:
        200:
          description: >-
            Returns detailed account information including parsed contract state and type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getShardAccountCell:
    get:
      tags:
        - accounts
      summary: Get Shard Address Cell
      description: Get raw TVM cell with shard account
      operationId: getShardAccountCell_get
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/seqnoOptional'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Shard Address Cell
      description: Get raw TVM cell with shard account
      operationId: getShardAccountCell_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShardAccountCellRequest'
        required: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getWalletInformation:
    get:
      tags:
        - accounts
      summary: Get Wallet Information
      description: >-
        Returns wallet-specific information for an address. If the address is a known wallet
        contract, returns the wallet type, current `seqno` (needed for sending transactions), and
        wallet_id. Always check `wallet: true` before using wallet-specific fields. Call this before
        sending any transaction to get the current `seqno`.
      operationId: getWalletInformation_get
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/seqnoOptional'
      responses:
        200:
          description: >-
            Returns wallet-specific details: type, `seqno`, subwallet ID, and balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Wallet Information
      description: >-
        Returns wallet-specific information for an address. If the address is a known wallet
        contract, returns the wallet type, current `seqno` (needed for sending transactions), and
        wallet_id. Always check `wallet: true` before using wallet-specific fields. Call this before
        sending any transaction to get the current `seqno`.
      operationId: getWalletInformation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletInformationRequest'
        required: true
      responses:
        200:
          description: >-
            Returns wallet-specific details: type, `seqno`, subwallet ID, and balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getAddressBalance:
    get:
      tags:
        - accounts
      summary: Get Address Balance
      description: >-
        Returns the TON balance of an account in nanotons. 1 TON = 1,000,000,000 nanotons. A
        lightweight endpoint that returns only the balance without contract code, data, or other
        account details. Returns "0" for addresses that have never received any funds.
      operationId: getAddressBalance_get
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/seqnoOptional'
      responses:
        200:
          description: >-
            Returns the account balance in nanotons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Address Balance
      description: >-
        Returns the TON balance of an account in nanotons. 1 TON = 1,000,000,000 nanotons. A
        lightweight endpoint that returns only the balance without contract code, data, or other
        account details. Returns "0" for addresses that have never received any funds.
      operationId: getAddressBalance_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBalanceRequest'
        required: true
      responses:
        200:
          description: >-
            Returns the account balance in nanotons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getAddressState:
    get:
      tags:
        - accounts
      summary: Get Address State
      description: >-
        Returns the account lifecycle state: `uninitialized` (no contract deployed), `active`
        (contract deployed), or `frozen` (contract state frozen).
      operationId: getAddressState_get
      parameters:
        - $ref: '#/components/parameters/address'
        - $ref: '#/components/parameters/seqnoOptional'
      responses:
        200:
          description: >-
            Returns the account lifecycle state: `uninitialized` (no contract deployed), `active`
            (contract deployed), or `frozen` (contract state frozen).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Address State
      description: >-
        Returns the account lifecycle state: `uninitialized` (no contract deployed), `active`
        (contract deployed), or `frozen` (contract state frozen).
      operationId: getAddressState_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressStateRequest'
        required: true
      responses:
        200:
          description: >-
            Returns the account lifecycle state: `uninitialized` (no contract deployed), `active`
            (contract deployed), or `frozen` (contract state frozen).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getTokenData:
    get:
      tags:
        - accounts
      summary: Get Token Data
      description: >-
        Returns metadata for Jetton or NFT contracts. Automatically detects the contract type and
        returns appropriate fields. For Jetton masters: total supply, admin, metadata. For Jetton
        wallets: balance, owner. For NFT items: collection, owner, content. For NFT collections:
        item count, metadata.
      operationId: getTokenData_get
      parameters:
        - $ref: '#/components/parameters/address'
      responses:
        200:
          description: >-
            Returns parsed token metadata for Jetton masters, Jetton wallets, NFT collections, and
            NFT items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Token Data
      description: >-
        Returns metadata for Jetton or NFT contracts. Automatically detects the contract type and
        returns appropriate fields. For Jetton masters: total supply, admin, metadata. For Jetton
        wallets: balance, owner. For NFT items: collection, owner, content. For NFT collections:
        item count, metadata.
      operationId: getTokenData_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenDataRequest'
        required: true
      responses:
        200:
          description: >-
            Returns parsed token metadata for Jetton masters, Jetton wallets, NFT collections, and
            NFT items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/dnsResolve:
    get:
      tags:
        - accounts
      summary: Resolve TON DNS name
      description: >-
        Recursively resolve a TON DNS domain into all records. Supports .ton, .t.me, and
        delegated subdomains. When resolver_address is omitted, discover the root from
        on-chain config parameter 4. Root discovery and all resolver calls use the same
        masterchain block, selected by seqno or the current state.
      operationId: dnsResolve_get
      parameters:
        - name: domain
          in: query
          description: Domain to resolve; relative to resolver_address when supplied. Case-insensitive; a trailing dot is accepted.
          required: true
          schema:
            type: string
        - name: resolver_address
          in: query
          description: Starting resolver address. Defaults to on-chain config parameter 4 at the selected block.
          required: false
          schema:
            $ref: '#/components/schemas/TonAddr'
        - $ref: '#/components/parameters/seqnoOptional'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Resolve TON DNS name
      description: >-
        Recursively resolve a TON DNS domain into all records, using the same behavior
        as GET. Replaces the former address, name, category, and ttl parameters with
        domain, resolver_address, and seqno. Missing records produce an empty entries array.
      operationId: dnsResolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsResolveRequest'
        required: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getMasterchainInfo:
    get:
      tags:
        - blocks
      summary: Get Masterchain Info
      description: >-
        Returns the current state of the TON masterchain. The `last` field contains the latest block
        used for querying current state. The `seqno` in `last` is the current block height. Use this
        endpoint to obtain the latest block reference for other queries.
      operationId: getMasterchainInfo_get
      parameters: [ ]
      responses:
        200:
          description: >-
            The current masterchain state, including the latest block identifier, its state root
            hash, and the genesis block reference. Use `result.last.seqno` as the current block
            height.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Masterchain Info
      description: >-
        Returns the current state of the TON masterchain. The `last` field contains the latest block
        used for querying current state. The `seqno` in `last` is the current block height. Use this
        endpoint to obtain the latest block reference for other queries.
      operationId: getMasterchainInfo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterchainInfoRequest'
        required: true
      responses:
        200:
          description: >-
            The current masterchain state, including the latest block identifier, its state root
            hash, and the genesis block reference. Use `result.last.seqno` as the current block
            height.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getMasterchainBlockSignatures:
    get:
      tags:
        - blocks
      summary: Get Masterchain Block Signatures
      description: >-
        Returns validator signatures for a specific masterchain block. Each signature proves that a
        validator approved this block. Use this for building cryptographic proofs or verifying block
        authenticity in trustless applications.
      operationId: getMasterchainBlockSignatures_get
      parameters:
        - $ref: '#/components/parameters/seqno'
      responses:
        200:
          description: >-
            Returns validator signatures for the specified masterchain block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
    post:
      tags:
        - rpc
      summary: Get Masterchain Block Signatures
      description: >-
        Returns validator signatures for a specific masterchain block. Each signature proves that a
        validator approved this block. Use this for building cryptographic proofs or verifying block
        authenticity in trustless applications.
      operationId: getMasterchainBlockSignatures_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterchainBlockSignaturesRequest'
        required: true
      responses:
        200:
          description: >-
            Returns validator signatures for the specified masterchain block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
          $ref: '#/components/responses/default'
      security:
        - APIKeyHeader: [ ]
        - APIKeyQuery: [ ]
  /api/v2/getShardBlockProof:
    get:
      tags:
        - blocks
      summary: Get Shard Block Proof
      description: >-
        Returns a Merkle proof that links a shardchain block to a masterchain block. This proof
        cryptographically verifies that the shard block is part of the canonical chain. Used by
        light clients and cross-chain bridges to verify shard data without trusting the API.
      operationId: getShardBlockProof_get
      parameters:
        - $ref: '#/components/parameters/workchain'
        - $ref: '#/components/parameters/shard'
        - $ref: '#/components/parameters/seqno'
        - name: from_seqno
          in: query
          description: Seqno of masterchain block starting from which proof is required. If not specified latest masterchain block is used
          required: false
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: >-
            Returns a cryptographic proof chain linking a shard block to the masterchain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TonlibResponse'
        default:
