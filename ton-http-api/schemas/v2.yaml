        '@type':
          description: >-
            TonLib type identifier for block transaction listings.
          type: string
          enum:
            - blocks.transactions
          default: blocks.transactions
        id:
          description: >-
            Full block identifier for the queried block.
          $ref: '#/components/schemas/TonBlockIdExt'
        req_count:
          type: integer
          description: >-
            The maximum number of transactions requested, as specified by the `count` request
            parameter. If `incomplete` is `true`, more transactions exist beyond this limit.
        incomplete:
          type: boolean
          description: >-
            Returns `true` if there are more transactions in this block; otherwise `false`. Use the
            last transaction as cursor for pagination.
        transactions:
          type: array
          description: >-
            Array of compact transaction references. Each entry contains the account address
            (string), logical time (string), and transaction hash (base64 or hex).
          items:
            $ref: '#/components/schemas/ShortTxId'
      required:
        - '@type'
        - id
        - req_count
        - incomplete
        - transactions
    BlockTransactionsExt:
      type: object
      additionalProperties: false
      description: >-
        List of full transaction objects found in a specific block, with a flag indicating whether
        more transactions are available for pagination.
      properties:
        '@type':
          description: >-
            TonLib type identifier for extended block transaction listings.
          type: string
          enum:
            - blocks.transactionsExt
          default: blocks.transactionsExt
        id:
          description: >-
            Full block identifier for the queried block.
          $ref: '#/components/schemas/TonBlockIdExt'
        req_count:
          type: integer
