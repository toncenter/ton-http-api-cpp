      properties:
        '@type':
          type: string
          enum:
            - blocks.blockData
          default: blocks.blockData
        id:
          $ref: '#/components/schemas/TonBlockIdExt'
          description: Extended identifier of the returned block.
        data:
          $ref: '#/components/schemas/Bytes'
          description: Full block BOC encoded as base64.
      required:
        - '@type'
        - id
        - data
    BlockHeader:
      type: object
      additionalProperties: true
      description: >-
        Block metadata including creation time, validator info, and links to previous blocks. Does
        not include the transactions themselves.
      properties:
        '@type':
          description: >-
            TonLib type identifier for block header objects.
          type: string
          enum:
            - blocks.header
          default: blocks.header
        id:
          $ref: '#/components/schemas/TonBlockIdExt'
          description: >-
            Full block identifier including workchain, shard, `seqno`, and hashes.
        global_id:
          type: integer
          description: Global network identifier.
        version:
          type: integer
          description: >-
            Block format version number.
        after_merge:
          type: boolean
          description: >-
            Returns `true` if this block was created immediately after a shard merge; otherwise
            `false`.
        after_split:
          type: boolean
          description: >-
            Returns `true` if this block was created immediately after a shard split; otherwise
            `false`.
        before_split:
          type: boolean
          description: >-
            Returns `true` if this shard will split after this block; otherwise `false`.
        want_merge:
          type: boolean
          description: >-
            Returns `true` if validators have signaled a preference to merge this shard; otherwise
            `false`.
        want_split:
          type: boolean
          description: >-
            Returns `true` if validators have signaled a preference to split this shard; otherwise
            `false`.
        validator_list_hash_short:
          type: integer
          description: >-
            Short hash of the validator set active during this block.
        catchain_seqno:
          type: integer
          description: >-
            Catchain sequence number used for validator consensus.
        min_ref_mc_seqno:
          type: integer
          description: >-
            Minimum masterchain block `seqno` referenced by this block.
        is_key_block:
          type: boolean
          description: >-
            Returns `true` if this is a key block containing validator set changes or config
            updates; otherwise `false`.
        prev_key_block_seqno:
          type: integer
          description: >-
            Sequence number of the previous key block.
        start_lt:
          type: string
          description: >-
            Logical time at the start of this block.
          x-usrv-cpp-type: 'std::int64_t'
        end_lt:
          type: string
          description: Ending logical time.
          x-usrv-cpp-type: 'std::int64_t'
        gen_utime:
          type: integer
          description: >-
            Unix timestamp when this block was generated.
        prev_blocks:
          type: array
          description: >-
            Array of previous block identifiers (`workchain`, `shard`, `seqno`, `root_hash`,
            `file_hash`). Usually contains one entry, but two after a shard merge.
          items:
            $ref: '#/components/schemas/TonBlockIdExt'
      required:
        - '@type'
        - id
        - global_id
        - version
        - after_merge
        - after_split
        - before_split
        - want_merge
        - want_split
        - validator_list_hash_short
        - catchain_seqno
        - min_ref_mc_seqno
        - is_key_block
        - prev_key_block_seqno
        - start_lt
        - end_lt
        - gen_utime
        - prev_blocks
    OutMsgQueueSizes:
