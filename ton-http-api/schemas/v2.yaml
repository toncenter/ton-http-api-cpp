        - '@type'
        - from
        - mc_id
        - links
        - mc_proof
    ConsensusBlock:
      type: object
      additionalProperties: false
      properties:
        '@type':
          description: >-
            TonLib type identifier for consensus block info.
          type: string
          enum:
            - ext.blocks.consensusBlock
          default: ext.blocks.consensusBlock
        consensus_block:
          description: >-
            Sequence number of the latest consensus block.
          type: integer
          format: int32
        timestamp:
          type: integer
          format: int32
      required:
        - '@type'
        - consensus_block
        - timestamp
    LookupBlock:
      $ref: '#/components/schemas/TonBlockIdExt'
    Shards:
      description: >-
        List of shardchain blocks at a specific masterchain height. Shows how the basechain is
        currently partitioned.
      type: object
      additionalProperties: false
      properties:
        '@type':
          description: >-
            TonLib type identifier for shard listing responses.
          type: string
          enum:
            - blocks.shards
          default: blocks.shards
        shards:
          description: >-
            Array of active shard block identifiers. Each entry contains `workchain` (integer),
            `shard` ID (string), `seqno` (integer), `root_hash` (base64/hex), and `file_hash`
            (base64/hex).
          type: array
          items:
            $ref: '#/components/schemas/TonBlockIdExt'
      required:
        - '@type'
        - shards
    BlockData:
      type: object
