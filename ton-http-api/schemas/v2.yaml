          format: int32
    # legacy run get method
    LegacyTvmCell:
      type: object
      additionalProperties: false
      required:
        - data
        - refs
        - special
      properties:
        data:
          description: >-
            Cell binary data.
          type: object
          additionalProperties: false
          required:
            - b64
            - len
          properties:
            b64:
              description: >-
                Cell data in base64.
              $ref: '#/components/schemas/Bytes'
            len:
              description: >-
                Data length in bits.
              type: integer
              format: int32
        refs:
          description: >-
            Array of child cell references, forming a directed acyclic graph (DAG). Each child is a
            TVM cell object with its own data (base64), refs, and special flag.
          type: array
          items:
            $ref: '#/components/schemas/LegacyTvmCell'
        special:
          description: >-
            Returns `true` if this is a special (exotic) cell type such as a Merkle proof or library
            reference; otherwise `false`.
          type: boolean
    LegacyStackEntryCell:
      type: object
      additionalProperties: false
      required:
        - bytes
      properties:
        bytes:
          description: >-
            Raw cell bytes in base64.
          $ref: '#/components/schemas/Bytes'
        object:
          description: >-
            Parsed cell object with data, refs, and type info.
          $ref: '#/components/schemas/LegacyTvmCell'
    LegacyStackEntry:
      type: array
      items:
        oneOf:
          - type: string
          - type: integer
            format: int64
          - $ref: '#/components/schemas/LegacyStackEntryCell'
          - $ref: '#/components/schemas/TvmTuple'
            x-usrv-cpp-indirect: true
          - $ref: '#/components/schemas/TvmList'
            x-usrv-cpp-indirect: true
      minItems: 2
      maxItems: 2
    RunGetMethodRequest:
      description: >-
        Request to execute a smart contract get method. Specify address, method name/ID, and input
        stack.
      type: object
      additionalProperties: false
      required:
        - address
        - method
        - stack
      properties:
        address:
          $ref: '#/components/schemas/TonAddr'
        method:
          description: >-
            The get method name (e.g., `seqno`, `get_wallet_data`) or its numeric ID.
          oneOf:
            - type: string
            - type: integer
              format: int32
        stack:
          description: >-
            Input arguments as a TVM stack. Each entry is a two-element array: `[type, value]` where
            type is `"num"` (decimal string), `"cell"` (base64 BoC), or `"slice"` (base64 BoC).
          type: array
          items:
            $ref: '#/components/schemas/LegacyStackEntry'
        seqno:
          description: >-
            Masterchain block sequence number. Run the get method against the contract state at this
            specific block height. If omitted, uses the current state.
          type: integer
          format: int32
    RunGetMethodResult:
      description: >-
        Result of executing a smart contract get method. Contains the TVM exit code (0 or 1 means
        success), gas used, and the output stack with return values.
      type: object
      additionalProperties: false
      required:
        - '@type'
        - gas_used
        - stack
        - exit_code
        - block_id
        - last_transaction_id
      properties:
        '@type':
          description: >-
            TonLib type identifier for get method execution results.
          type: string
          enum:
            - smc.runResult
          default: smc.runResult
        gas_used:
          description: >-
            Gas consumed during execution. Useful for cost estimation.
          type: integer
          format: int64
        stack:
          type: array
          items:
            $ref: '#/components/schemas/LegacyStackEntry'
        exit_code:
          description: >-
            TVM exit code. `0` or `1` means success; other values indicate errors. Refer to the TVM
            exit code reference for all values.
          type: integer
          format: int32
        block_id:
          description: >-
            Block at which the get method was executed.
          $ref: '#/components/schemas/TonBlockIdExt'
        last_transaction_id:
          description: >-
            Most recent transaction at the time of execution.
          $ref: '#/components/schemas/InternalTransactionId'
